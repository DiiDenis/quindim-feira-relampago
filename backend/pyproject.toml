[project]
name = "quindim-feira-relampago-backend"
version = "0.1.0"
description = "API da Feira Relâmpago do Clube Quindim"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3,<4",
    "gunicorn>=23,<24",
    "pydantic>=2,<3",
    "pymongo>=4.10,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unitarios", "tests/integracao"]
addopts = ["--strict-markers"]
markers = [
    "integracao: testes que dependem de serviços reais",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
