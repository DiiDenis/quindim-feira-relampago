services:
  mongo:
    image: mongo:8
    volumes:
      - mongo_dados:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
      target: runtime
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      NUXT_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  testes:
    profiles:
      - teste
    pull_policy: build
    build:
      context: ./backend
      target: testes
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      api:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/unitarios", "tests/integracao", "-v"]

volumes:
  mongo_dados:
